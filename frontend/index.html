
<!--lei un poco sobre html y esto fue lo que entendi, lo estoy escribiendo con mis propias palabras-->

<!--HTML NO es un lenguaje de programacion, no ejecuta logica, es un leguaje de tipado (aun no
    tengo claro lo que significa esto) pero lo que hace es dar jerarquia y
    orden a los elementos que se mostraran en pantalla, es como el esqueleto que ordena los elementos-->


<!--esta primera linea es indica al motor que tipo de html va a ejecutar, en este caso seria html5,
    de otro modo ejecutaria versiones antiguas o entrando en modo de compatibilidad-->

<!DOCTYPE html>
<!--todos documento de hmtl debe dentro de la etiqueta de html, yo lo pienso como una carpeta que
    que contendra el contenido completo-->

<html>

<!--el apartado head es una etiqueda que guarda metadatos, los elementos que no son visibles,
    como configuraciones-->
<head>

<!--la etiqueta title definel el nombre de la pestana que se mostrara en el navegador-->
    <title >Mi primera pagina</title>
</head>

<!--en body se colocan todos los elementos que se mostraran, encabezas, parrafos, titulos, subtitulos-->
<body>

<!--le headers son encabezados, visualmente son maa grandes que el los parrafos, son seis headers
    de h1 a h6, la diferencia no solo es el tamano, si no que dan un orden jerarquico-->
    <h1>Mi primer encabezado</h1>

<!--este es un bloque de texto normal-->
    <p> mi primer parrafo :)</p>
</body>

</html>
